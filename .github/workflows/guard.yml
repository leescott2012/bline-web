name: guard

# Blocks the failure classes that actually reached main on 2026-08-04.
# Deliberately deterministic: a compiler and a grep settle these faster than
# any agent, and they cannot be confidently wrong. Judgement calls — trademark
# risk, product scope — stay in AGENTS.md, where a human decides.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need history to diff against the base. The default shallow clone
          # made the diff fail and silently fall back to "every source file",
          # which fired the image probe on a docs-only commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The one that matters most: `vite build` does NOT typecheck, so two PRs
      # reached main with a combined 40 type errors while reporting success.
      - name: typecheck
        run: npx tsc --noEmit

      - name: build
        run: npm run build

      - name: changed files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --quiet
          else
            BASE="${{ github.event.before }}"
          fi
          # Empty/unknown base (first push, force-push) => empty list, which
          # guard.mjs treats as "check everything".
          if ! git cat-file -e "$BASE" 2>/dev/null; then BASE=""; fi
          FILES=$([ -n "$BASE" ] && git diff --name-only "$BASE"...HEAD || echo "")
          echo "count=$(printf '%s' "$FILES" | grep -c . || true)"
          { echo "files<<EOF"; echo "$FILES"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: guards
        env:
          GUARD_FILES: ${{ steps.changed.outputs.files }}
        run: node scripts/guard.mjs
