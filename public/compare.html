<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>B-line · Figma vs Build</title>
<style>
  body { background: #0b0b0f; color: #fff; font: 14px -apple-system, sans-serif; margin: 0; padding: 24px; }
  h1 { font-size: 20px; }
  .row { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 48px; }
  .col { text-align: center; }
  .col p { margin: 0 0 8px; color: #9ca3af; font-weight: 600; }
  /* Figma frames are 1536x2752 logical = 393x704pt-ish; render both at 393 wide, 852 tall app vs ref natural ratio */
  img.ref { width: 393px; display: block; border-radius: 16px; }
  iframe { width: 393px; height: 852px; border: 0; border-radius: 16px; background: #0b0b0f; }
</style>
</head>
<body>
<h1>B-line — Figma reference (left) vs build (right)</h1>
<div id="rows"></div>
<script>
const screens = [
  ["01 Home", "refs/01-home.png", "/"],
  ["02 Detail", "refs/02-detail.png", "/spot/new-realm"],
  ["03 Reserve", "refs/03-reserve.png", "/reserve/new-realm"],
  ["04 Map view", "refs/04-map.png", "/map"],
  ["05 Trail detail", "refs/05-trail-detail.png", "/trail"],
  ["06 Turn-by-turn", "refs/06-navigation.png", "/navigate"],
  ["07 Crowd density", "refs/07-crowd.png", "/conditions"],
  ["08 Map styles", "refs/08-map-styles.png", "/map-styles"],
  ["09 Friends", "refs/09-friends.png", "/friends"],
  ["10 Filters", "refs/10-filters.png", "/filters"],
  ["11 Saved", "refs/11-saved.png", "/saved"],
];
const only = new URLSearchParams(location.search).get("only");
const list = only ? [screens[+only - 1]] : screens;
document.getElementById("rows").innerHTML = list.map(([name, ref, route]) => `
  <h2>${name}</h2>
  <div class="row">
    <div class="col"><p>Figma</p><img class="ref" src="${ref}" loading="lazy" /></div>
    <div class="col"><p>Build</p><iframe src="${route}" loading="lazy"></iframe></div>
  </div>`).join("");
</script>
</body>
</html>
